<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn anything: personalised courses written just in time, with a tutor in the margins."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Marginalia</title>
    <script>
      // Apply the saved or system theme before the first paint to avoid a flash
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("marginalia-theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
