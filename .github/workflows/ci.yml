name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Python, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marginalia
          POSTGRES_PASSWORD: marginalia
          POSTGRES_DB: marginalia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marginalia"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://marginalia:marginalia@localhost:5432/marginalia_test
      TEST_DATABASE_URL: postgresql://marginalia:marginalia@localhost:5432/marginalia_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations apply, match the models and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - run: uv run pytest

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
