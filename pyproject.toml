[project]
name = "marginalia"
version = "0.1.0"
description = "Personalised, just-in-time courses on anything, with an AI tutor in the margins."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# Marginalia is derived from textbook_quality by Vik Paruchuri (MIT licence).
# See NOTICE for attribution.
authors = [{ name = "Rajesh Bhusal" }]
dependencies = [
    "alembic>=1.20",
    "anthropic>=2.1,<3",
    "asyncpg>=0.32",
    "fastapi>=0.161",
    "jinja2>=3.1.6",
    "openai>=3.37,<4",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
marginalia = "app.cli:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.22",
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make ruff treat the package as first-party
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
